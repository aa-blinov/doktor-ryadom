<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="assets/vendor/gsap.min.js"></script>
<style>

@font-face { font-family: "Golos Text"; src: url("assets/fonts/golos-text-cyrillic-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Golos Text"; src: url("assets/fonts/golos-text-cyrillic-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Golos Text"; src: url("assets/fonts/golos-text-cyrillic-700-normal.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Golos Text"; src: url("assets/fonts/golos-text-cyrillic-800-normal.woff2") format("woff2"); font-weight: 800; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f5f6f2; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f5f6f2; color: #23382f; font-family: "Golos Text", system-ui, sans-serif; }
.scene, .inner { position: absolute; inset: 0; }
.muted { color: #5a6860; }
.h { position: absolute; font-weight: 750; letter-spacing: -1px; line-height: 1.2; }
.t { position: absolute; line-height: 1.4; }
.b { font-weight: 700; }
.card { position: absolute; background: #ffffff; border: 1px solid #dce3db; border-radius: 16px; }
.panel { position: absolute; left: 160px; top: 130px; width: 1600px; height: 690px; background: #ffffff; border: 1px solid #dce3db; border-radius: 20px; }
.pill { position: absolute; width: 230px; height: 110px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #dce3db; border-radius: 13px; font-size: 26px; font-weight: 600; }
.ans { position: absolute; left: 200px; width: 900px; height: 76px; display: flex; align-items: center; padding-left: 32px; background: #ffffff; border: 1px solid #dce3db; border-radius: 12px; font-size: 30px; }
.chip { position: absolute; padding: 8px 18px; border-radius: 8px; font-size: 24px; font-weight: 600; white-space: nowrap; }
.soft { background: #e8efe7; color: #3c614a; }
.accent { background: #326950; color: #ffffff; }
.sos { background: #fbf3ee; color: #a85424; }
.row { position: absolute; left: 160px; width: 1600px; height: 120px; background: #ffffff; border: 1px solid #dce3db; border-radius: 16px; }
.row .t { left: 56px; top: 38px; font-size: 34px; font-weight: 600; }
.box { position: absolute; width: 36px; height: 36px; border: 2px solid #326950; border-radius: 8px; background: #ffffff; }
.seg { position: absolute; height: 10px; border-radius: 5px; background: #dce3db; }
.day { position: absolute; top: 330px; width: 60px; height: 60px; border: 1px solid #dce3db; border-radius: 12px; background: #ffffff; }
.btn { position: absolute; height: 84px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 30px; font-weight: 600; }
.center { position: absolute; left: 0; right: 0; text-align: center; }
.chap { position: absolute; top: 26px; text-align: center; font-size: 22px; font-weight: 600; color: #5a6860; }
#capbar { position: absolute; left: 160px; top: 868px; width: 1600px; height: 160px; background: #ffffff; border: 1px solid #dce3db; border-radius: 20px; }
.cap { position: absolute; left: 200px; top: 868px; width: 1520px; height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 36px; font-weight: 600; line-height: 1.35; opacity: 0; }
.cap .l2 { font-weight: 400; color: #5a6860; font-size: 32px; }

.poster { position: absolute; left: 160px; top: 120px; bottom: 120px; width: 1000px; display: flex; flex-direction: column; }
.poster h1 { font-size: 104px; font-weight: 750; letter-spacing: -3px; line-height: 1.08; margin-top: 28px; text-wrap: balance; }
.poster .sub { font-size: 36px; color: #5a6860; margin-top: 32px; }
.poster .chip { position: static; align-self: flex-start; font-size: 26px; }
</style>
</head>
<body>
<div id="root">
<div class="poster">
<div style="display:flex; align-items:center; gap:12px; color:#326950; font-size:44px; font-weight:800; letter-spacing:-1.5px; line-height:1;"><svg width="51" height="51" viewBox="0 0 36 36" aria-hidden="true"><path fill="#326950" d="M5 6c13 0 20 9 20 24C12 30 5 21 5 6Z"/><path fill="#a9c3a0" d="M30 4c-11 2-16 10-15 22C27 25 32 16 30 4Z"/></svg><span>рядом<span style="color:#7c9573;">.</span></span></div>
<div style="height:150px;"></div>
<div class="chip soft">Для пациента</div>
<h1>Что делать между приёмами?</h1>
<div class="sub">Дневник состояния и связь с врачом</div>
</div>
<div style="position:absolute; left:1150px; top:190px;"><svg width="700" height="700" viewBox="0 0 36 36" aria-hidden="true"><path fill="#326950" d="M5 6c13 0 20 9 20 24C12 30 5 21 5 6Z"/><path fill="#a9c3a0" d="M30 4c-11 2-16 10-15 22C27 25 32 16 30 4Z"/></svg></div>
</div>

</html>
